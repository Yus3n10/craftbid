<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F3A4D" />
    <meta
      name="description"
      content="Craftbid connects Filipino handmade-craft artists with people who want to commission their work."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!--
      Link previews. These have to be in the HTML the server sends, not added by
      React: Messenger's and Facebook's crawlers, and most others, read the
      first response and never run the app. Cloudflare serves this same file
      for every route, so a shared link to any page shows this card.

      Absolute URLs throughout, because a crawler resolves nothing relative to
      the page it was given. Change them together if the site moves domain.

      The preview image (og:image, og:image:width/height/type/alt, and
      twitter:card "summary_large_image") is added with the image the client
      supplies. Until then the card is text only, rather than pointing at a
      file that does not exist and showing a broken image.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Craftbid" />
    <meta property="og:locale" content="en_PH" />
    <meta property="og:url" content="https://craftbid.pgeagoni.workers.dev/" />
    <meta property="og:title" content="Craftbid — Commission handmade work from Filipino artists" />
    <meta
      property="og:description"
      content="Craftbid connects Filipino handmade-craft artists with people who want to commission their work."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Craftbid — Commission handmade work from Filipino artists" />
    <meta
      name="twitter:description"
      content="Craftbid connects Filipino handmade-craft artists with people who want to commission their work."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fraunces carries the display voice: its WONK axis gives letterforms a
      hand-cut irregularity that suits work made by hand. Karla handles UI text.
      Both degrade to system faces offline, which matters for the desktop build.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Craftbid — Commission handmade work from Filipino artists</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
