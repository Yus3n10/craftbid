# Render blueprint for the API.
#
# Render is used rather than a serverless host because the Oracle driver needs
# a long-lived process holding real TCP sockets. Serverless and edge runtimes
# cannot run it at all: Thick mode needs a native Instant Client, and Thin mode
# needs full node:net and node:tls with custom PEM wallet material.
#
# Secrets are marked `sync: false` so Render prompts for them instead of them
# living in this file.
services:
  - type: web
    name: craftbid-api
    runtime: node
    plan: free
    # Closest region to the Philippines, which is where the users are.
    region: singapore
    healthCheckPath: /health

    # Installing pnpm with npm rather than corepack, after corepack cost three
    # failed deploys: its shims default to the read-only /usr/bin (EROFS), and
    # pointing it elsewhere needs both a pre-created directory and a PATH edit.
    #
    # npm puts a global install next to the Node that Render provisioned, under
    # /opt/render/project/nodes/<version>/, which is writable and already on
    # PATH. No directory to create, no PATH to manipulate.
    #
    # Keep this version in step with `packageManager` in the root package.json.
    buildCommand: >-
      npm install -g pnpm@10.34.5 &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @craftbid/shared build &&
      pnpm --filter @craftbid/api build

    startCommand: node apps/api/dist/index.js

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

      # Autonomous Database. ORACLE_CONNECT_STRING is a TNS alias from the
      # wallet's tnsnames.ora, such as myadb_tp.
      - key: ORACLE_USER
        sync: false
      - key: ORACLE_PASSWORD
        sync: false
      - key: ORACLE_CONNECT_STRING
        sync: false

      # The two wallet files Thin mode needs, base64 encoded. They are written
      # to a temporary directory at startup. See docs/DEPLOY.md.
      - key: ORACLE_TNSNAMES_B64
        sync: false
      - key: ORACLE_EWALLET_PEM_B64
        sync: false

      # Required whenever ewallet.pem begins with "BEGIN ENCRYPTED PRIVATE
      # KEY", which is what the OCI console produces when a wallet password is
      # set on download. Without it the TLS handshake fails with NJS-505 after
      # roughly a minute of silence.
      - key: ORACLE_WALLET_PASSWORD
        sync: false

      # A free instance is capped at 512MB and sleeps when idle, so a large
      # pool would be held open across a sleep and produce ORA-03113 on wake.
      - key: ORACLE_POOL_MIN
        value: 0
      - key: ORACLE_POOL_MAX
        value: 4

      - key: JWT_SECRET
        generateValue: true

      # The deployed web origin. Cookies are sent cross-origin, so this must be
      # exact, with no trailing slash.
      - key: CORS_ORIGINS
        sync: false

      # Render's disk is ephemeral and wiped on every deploy, so the local
      # storage driver would silently lose every uploaded image. Config refuses
      # to boot with it in production.
      - key: STORAGE_DRIVER
        value: imagekit
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
