name: Release desktop app

# Builds the installable desktop app and attaches it to a GitHub Release.
# Runs on a version tag, or on demand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not discard installers that built cleanly.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (.msi, .exe)
            args: ""
          - os: macos-latest
            label: macOS (Apple silicon)
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            label: macOS (Intel)
            args: "--target x86_64-apple-darwin"
          # 22.04 rather than latest: the AppImage links against the glibc of
          # the build machine, so building on the oldest supported runner is
          # what makes it run on older distributions too.
          - os: ubuntu-22.04
            label: Linux (.AppImage, .deb)
            args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        # Ayatana only. The older libappindicator3-dev declares a Conflicts
        # against it, so asking for both leaves apt with nothing to solve and
        # it stops with "held broken packages". Tauri v2 wants the ayatana one.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev

      # Version comes from `packageManager` in package.json; setting both here
      # and there is an error.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Pinned to a commit, so the toolchain has to be named; the action reads
      # it from the ref only when the ref is a branch name.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate app icons
        # Icons are derived from the source PNG rather than committed, so the
        # .ico and .icns binaries in the installers are always in step with it.
        run: pnpm desktop:icons

      # Every third-party action in this job is pinned to a commit rather than a
      # tag its owner can move, since the job holds contents: write.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Craftbid ${{ github.ref_name }}"
          releaseBody: |
            Desktop build of Craftbid.

            Download the installer for your platform below. The app connects to
            the hosted Craftbid API, so an internet connection is required.

            The macOS and Windows builds are unsigned: macOS will need
            right-click then Open on first launch, and Windows will show a
            SmartScreen warning. Code signing certificates cost money and this
            project runs on a zero budget.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
