name: Release desktop app

# Builds the installable desktop app and attaches it to a GitHub Release.
# Runs on a version tag, or on demand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not discard installers that built cleanly.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (.msi, .exe)
            args: ""
          - os: macos-latest
            label: macOS (Apple silicon)
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            label: macOS (Intel)
            args: "--target x86_64-apple-darwin"
          # 22.04 rather than latest: the AppImage links against the glibc of
          # the build machine, so building on the oldest supported runner is
          # what makes it run on older distributions too.
          - os: ubuntu-22.04
            label: Linux (.AppImage, .deb)
            args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate app icons
        # Icons are derived from the source PNG rather than committed, so the
        # .ico and .icns binaries in the installers are always in step with it.
        run: pnpm desktop:icons

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "RaxTan ${{ github.ref_name }}"
          releaseBody: |
            Desktop build of RaxTan.

            Download the installer for your platform below. The app connects to
            the hosted RaxTan API, so an internet connection is required.

            The macOS and Windows builds are unsigned: macOS will need
            right-click then Open on first launch, and Windows will show a
            SmartScreen warning. Code signing certificates cost money and this
            project runs on a zero budget.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
