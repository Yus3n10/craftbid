name: Keep the database alive

# Oracle's Always Free Autonomous Database stops itself after 7 consecutive
# days of inactivity, and is PERMANENTLY DELETED after 90 cumulative idle days.
# A marketplace that is quiet for a week would otherwise wake up to a stopped
# database, and one quiet for three months would have no database at all.
#
# /health runs `SELECT 1` against the database rather than only reporting that
# the process is up, so this genuinely resets the idle clock. It also warms
# Render's free tier, which spins down after 15 minutes.
on:
  schedule:
    # Twice a week, well inside the 7-day window even if a run is skipped.
    # GitHub disables schedules on repositories with no activity for 60 days,
    # which is itself within the 90-day deletion window, so do not rely on this
    # alone if the project goes dormant.
    - cron: "0 3 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API health check
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Repository variable API_URL is not set; nothing to ping."
            echo "Set it under Settings -> Secrets and variables -> Actions -> Variables."
            exit 0
          fi

          echo "Pinging $API_URL/health"
          # Render's free tier cold start can take 60 seconds, and the database
          # may itself be resuming, so allow a generous timeout and retry.
          for attempt in 1 2 3 4 5; do
            status=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
              --max-time 120 "$API_URL/health" || echo "000")
            echo "Attempt $attempt: HTTP $status"
            cat /tmp/health.json 2>/dev/null || true
            echo
            # /health answers 200 whenever the process is up, including when
            # the database is unreachable, so the body is what matters here.
            # Only a real query resets the idle timer.
            if [ "$status" = "200" ] && grep -q '"database":"reachable"' /tmp/health.json; then
              echo "Database reachable; idle timer reset."
              exit 0
            fi
            sleep 30
          done

          echo "Could not reach the API after 5 attempts."
          exit 1
